# GR III and GR IIIx.
#
# Selected film packs: a starting recipe for each stock, for one camera
# family. gr3.toml is for the GR III and GR IIIx, gr4.toml for the GR IV.
# The package for a camera takes the file of its family.
#
# A recipe names its Film Look by effect ID (the directory name in effects/),
# never by its place in CORE.TONE, which can change at each start. A module
# finds the value with effect_find (docs/module-reference.md).
#
# Film (extras/film) lists every pack on one ADJ page, in file order, grouped
# by type with a group field per pack: negative, slide, cine, bw, instant.
# The page may have at most 63 recipes (GRM_PAGE_ROWS, with Off).
#
# Both files list the same packs, in the same order, with the same effect,
# name, white balance, and aspect. Only grain differs: at the same setting,
# the grain of the GR IIIx is weaker than that of the GR IV, so the GR IIIx
# file sets it one step stronger for the same look. The test
# crates/grkit-core/tests/recipes.rs checks this.
#
# status:
#   tested            colour, tone, white balance and grain checked on this
#                     camera family
#   grain-unverified  colour, tone and white balance checked; the grain is
#                     one step stronger than the tested setting of the other
#                     family, not yet shot
#   untested          a starting guess, not yet shot
#   needs-effect      no effect in effects/ yet
#
# UltraMax 400 takes the place of ColorPlus 200, whose only open-source
# LUT (t3mujinpack) fits the effect model at grade C.
#
# grain:          off, weak, medium, strong, extra-strong   (CORE.GRAIN)
# grain_size:     auto, small, medium, large                 (CORE.GRAIN_SIZE)
# aspect:         native, xpan, 16:9, 4:3, 2.35:1, 1:1, 5:4, 7:6, or absent
#                 to leave the aspect as it is              (CORE.ASPECT)
# group:          negative, slide, cine, bw, or instant
# white_balance:  a suggestion that the photographer sets by hand, with the
#                 white balance shift at 0 / 0. Recipes do not set white
#                 balance yet.
#
# Test shoots, 30 Oct 2026, GR IV 1.20 and GR IIIx 1.70, GRKit 1.3.3:
# colour, tone and white balance match across the families with Daylight
# white balance, shift 0 / 0, and Fn adjustments at 0.

[[pack]]
