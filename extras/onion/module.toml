# Onion Skin: a faint picture over the live view to line up a shot: the last
# shot or a held reference.
id = "ONION"
version = 1
# The default place in ADJ and in MENU: after Roll (6).
order = 7
sources = ["onion.c"]
# Tile n shows mode n. Tile 0 is the module tile, for Off at the root.
tiles = [
    "tiles/0-module.png",
    "tiles/1-last.png",
    "tiles/2-hold.png",
]

# 0 Off, 1 Last Shot, 2 Hold Reference.
[[settings]]
key = "MODE"
values = 3
saved = true
public = true

# 0 Faint, 1 Strong, 2 Edges.
[[settings]]
key = "STYLE"
values = 3
saved = true

[page]
setting = "MODE"
off_row = true
settings = ["MODE", "STYLE"]

[events]
handle = "onion_event"
on = ["setting_changed"]

# Takes the picture for Last Shot and Hold Reference. It changes no picture.
[[filters]]
apply = "onion_apply"
setting = "MODE"
stage = "mark"

# Over the Framing mask (10), under Guides (20).
[[layers]]
paint = "onion_paint"
setting = "MODE"
order = 15
