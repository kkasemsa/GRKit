# Recipe C: the third menu of film recipes, the pushed, slide, cinema, and
# instant stocks that A and B have no room for, with the code of Recipe A
# (extras/recipe/recipe_impl.h). Choosing a recipe in any menu sets the
# others to Off. The recipes are
# data of the camera family: menu "c" of recipes/<family>.toml, generated
# into recipes-<family>.h. recipes.h selects the family;
# scripts/recipe-module.sh builds the module of a family.
id = "RECIPEC"
version = 1
# The default place in ADJ and in MENU: after Recipe B (6).
order = 7
sources = ["recipe.c"]
# Tile n shows recipe n. Tile 0 is the module tile, for Off at the root.
tiles = [
    "tiles/0-module.png",
    "tiles/1-portra-800.png",
    "tiles/2-ektachrome-e100.png",
    "tiles/3-vision3-250d.png",
    "tiles/4-double-x-5222.png",
    "tiles/5-astia-100f.png",
    "tiles/6-instax.png",
]
uses = ["CORE.TONE", "CORE.GRAIN", "CORE.GRAIN_SIZE", "?CORE.ASPECT", "?RECIPE.PICK", "?RECIPEB.PICK"]

# 0 Off, then recipe n - 1 of recipes.h.
[[settings]]
key = "PICK"
values = 7
saved = true
public = true

# 0 Keep. 1 applies the chosen recipe again and returns to Keep.
[[settings]]
key = "RESET"
values = 2

# The viewfinder label: 0 Show, 1 Hide.
[[settings]]
key = "NAME"
values = 2
saved = true

[page]
setting = "PICK"
off_row = true
settings = ["PICK", "RESET", "NAME"]

[events]
handle = "recipe_event"
on = ["setting_changed"]

# The name of the recipe shows with the full display, below the first rows of
# native text.
[[layers]]
paint = "recipe_badge"
setting = "PICK"
order = 45
full_disp = true
live_only = true
