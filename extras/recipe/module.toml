# Recipe A: a short menu of film recipes, each a Film Look with its grain and
# an optional aspect: the colour negatives. Recipe B (extras/recipe-b) has the
# black-and-white, slide, and cinema recipes; choosing one in either menu
# sets the other to Off. The recipes are data of the camera family: menu "a"
# of recipes/<family>.toml, generated into recipes-<family>.h. recipes.h selects
# the family; scripts/recipe-module.sh builds the module of a family.
id = "RECIPE"
version = 1
# The default place in ADJ and in MENU: first, before Film Look (10).
order = 5
sources = ["recipe.c"]
# Tile n shows recipe n. Tile 0 is the module tile, for Off at the root.
tiles = [
    "tiles/0-module.png",
    "tiles/1-portra-400.png",
    "tiles/2-ektar-100.png",
    "tiles/3-gold-200.png",
    "tiles/4-ultramax-400.png",
    "tiles/5-c200.png",
]
uses = ["CORE.TONE", "CORE.GRAIN", "CORE.GRAIN_SIZE", "?CORE.ASPECT", "?RECIPEB.PICK"]

# 0 Off, then recipe n - 1 of recipes.h.
[[settings]]
key = "PICK"
values = 6
saved = true
public = true

# 0 Keep. 1 applies the chosen recipe again and returns to Keep.
[[settings]]
key = "RESET"
values = 2

# The viewfinder label: 0 Show, 1 Hide.
[[settings]]
key = "NAME"
values = 2
saved = true

[page]
setting = "PICK"
off_row = true
settings = ["PICK", "RESET", "NAME"]

[events]
handle = "recipe_event"
on = ["setting_changed"]

# The name of the recipe shows with the full display, below the first rows of
# native text.
[[layers]]
paint = "recipe_badge"
setting = "PICK"
order = 45
full_disp = true
live_only = true
